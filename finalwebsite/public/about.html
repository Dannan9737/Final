<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體設計</title>
    <link rel="icon" href="images/Logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <h1><img src="images/MD-logo.png" alt="LOGO" class="logo">多媒體設計</h1>
        <nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">應用領域</a></li>
                <li><a href="courses.html">學習內容</a></li>
                <li><a href="works.html">展示作品</a></li>
                <li><a href="#" id="openLogin">聯絡/登錄</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="exp">
            <div class="exp-content">
                <h2>多媒體設計的應用與領域</h2>
            </div>
        </section>
    </main>

    <section class="section-light">
        <div class="container">

            <div class="row g-4" id="field-container">

            </div>
    </section>

    <section class="career">
        <h2>畢業方向與就業前景</h2>
        <p>
            畢業生可從事遊戲設計、動畫製作、影視後製、網頁與互動設計、數位行銷與新媒體藝術等工作。
        </p>

        <section class="info-career py-5">
            <div class="container">
                <div class="row g-4 justify-content-center" id="career-container">

                </div>
            </div>
        </section>
    </section>

    <footer>
        <p>&copy; 2026 多媒體設計系 | 國立台中科技大學</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>聯絡與登錄</h2>
            <form id="loginForm" action="/contact" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label>姓名</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label>電子郵件</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>訊息內容</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>上傳附件 (選填)</label>
                    <input type="file" name="myFile" style="border:none; background:none;">
                </div>
                <button type="submit" class="submit-btn">傳送並登入</button>
            </form>
        </div>
    </div>

    <script>
        function initAboutAnimations() {
            gsap.registerPlugin(ScrollTrigger);

            // 領域卡片動畫
            gsap.from(".card", {
                opacity: 0,
                y: 30,
                stagger: 0.2,
                duration: 0.8,
                clearProps: "transform", // 動畫結束後清除 transform，讓 CSS hover 恢復正常
                scrollTrigger: {
                    trigger: "#field-container",
                    start: "top 80%"
                }
            });

            // 職業項目動畫
            gsap.from(".career-item", {
                opacity: 0,
                scale: 0.8,
                stagger: 0.1,
                duration: 0.6,
                scrollTrigger: { trigger: "#career-container", start: "top 85%" }
            });
        }

        async function loadAboutPage() {
            try {
                // 同時抓取兩個 API
                const [fieldRes, careerRes] = await Promise.all([
                    fetch('/fields'),
                    fetch('/careers')
                ]);
                const fields = await fieldRes.json();
                const careers = await careerRes.json();

                // 渲染領域卡片
                document.getElementById('field-container').innerHTML = fields.map(item => `
                <div class="col-md-3">
                    <div class="card h-100">
                        <img src="${item.img}" class="card-img-top" alt="${item.title}">
                        <div class="card-body">
                            <h5 class="card-title">${item.title}</h5>
                            <p class="card-text">${item.text}</p>
                        </div>
                    </div>
                </div>
            `).join('');

                // 渲染職業項目
                document.getElementById('career-container').innerHTML = careers.map(item => `
                <div class="col-6 col-md-4 text-center">
                    <div class="career-item">
                        <img src="${item.img}" class="img-fluid" alt="${item.title}">
                        <p class="career-title">${item.title}</p>
                    </div>
                </div>
            `).join('');

                // 啟動動畫
                initAboutAnimations();
            } catch (err) {
                console.error("載入失敗:", err);
            }
        }

        window.addEventListener('load', loadAboutPage);
    </script>

</body>

</html>
