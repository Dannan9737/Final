<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體設計 - 作品展示</title>
    <link rel="icon" href="images/Logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <h1><img src="images/MD-logo.png" alt="LOGO" class="logo">多媒體設計</h1>
        <nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">應用領域</a></li>
                <li><a href="courses.html">學習內容</a></li>
                <li><a href="works.html">展示作品</a></li>
                <li><a href="#" id="openLogin">聯絡/登錄</a></li>
            </ul>
        </nav>
    </header>

    <section class="works-slider">
        <div class="main-display" id="main-display">

        </div>

        <div class="thumbnails" id="thumb-container">

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>聯絡與登錄</h2>
            <form id="loginForm" action="/contact" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label>姓名</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label>電子郵件</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>訊息內容</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>上傳附件 (選填)</label>
                    <input type="file" name="myFile" style="border:none; background:none;">
                </div>
                <button type="submit" class="submit-btn">傳送並登入</button>
            </form>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        let slides = [];
        let thumbs = [];

        async function loadWorks() {
            try {
                const res = await fetch('/works');
                const data = await res.json();

                const displayContainer = document.getElementById('main-display');
                const thumbContainer = document.getElementById('thumb-container');

                // 1. 動態生成 HTML
                data.forEach((work, index) => {
                    const activeClass = index === 0 ? 'active' : '';

                    displayContainer.innerHTML += `
                    <div class="slide ${activeClass}" style="opacity: ${index === 0 ? 1 : 0}">
                        <div class="slide-bg" style="background-image: url('${work.img}');"></div>
                        <div class="slide-content">
                            <h3>${work.title}</h3>
                            <p><strong>類型：</strong>${work.type}</p>
                            <p><strong>特色：</strong>${work.feature}</p>
                            <p><strong>亮點：</strong>${work.highlight}</p>
                            <p>${work.desc}</p>
                        </div>
                    </div>
                `;

                    thumbContainer.innerHTML += `
                    <div class="thumb ${activeClass}" data-index="${index}">
                        <img src="${work.img}" alt="${work.title}">
                    </div>
                `;
                });

                // 2. 獲取剛剛生成的元素
                slides = document.querySelectorAll('.slide');
                thumbs = document.querySelectorAll('.thumb');

                // 3. 綁定事件
                thumbs.forEach((thumb, index) => {
                    thumb.addEventListener('click', () => changeSlide(index));
                });

                // 初始進場動畫
                if (slides[0]) {
                    const content = slides[0].querySelector('.slide-content');
                    gsap.fromTo(content, { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8 });
                }

            } catch (err) {
                console.error("載入作品失敗:", err);
            }
        }

        let isAnimating = false; // 防止連點造成的閃爍

        // 4. 切換邏輯 (整合 GSAP)
        function changeSlide(nextIndex) {
            // 如果正在動畫中，或是點擊的是目前的投影片，則不執行
            if (isAnimating || nextIndex === currentIndex) return;

            isAnimating = true; // 開始動畫，鎖定點擊

            // 1. 處理舊的投影片 (currentIndex)
            const oldSlide = slides[currentIndex];
            const oldThumb = thumbs[currentIndex];
            const oldBg = oldSlide.querySelector('.slide-bg');

            oldThumb.classList.remove('active');

            // 讓舊投影片優雅淡出
            gsap.to(oldSlide, {
                opacity: 0,
                duration: 0.8,
                ease: "power2.inOut",
                onComplete: () => {
                    gsap.set(oldSlide, { visibility: "hidden", pointerEvents: "none" });
                    if (oldBg) gsap.set(oldBg, { scale: 1.1 }); // 重置背景縮放
                }
            });

            // 2. 更新索引
            currentIndex = nextIndex;

            // 3. 處理新的投影片 (nextIndex / 新的 currentIndex)
            const newSlide = slides[currentIndex];
            const newThumb = thumbs[currentIndex];
            const newBg = newSlide.querySelector('.slide-bg');
            const newContent = newSlide.querySelector('.slide-content');

            newThumb.classList.add('active');

            // 立即將新投影片設為可見但透明，並放在舊的上面
            gsap.set(newSlide, { visibility: "visible", pointerEvents: "auto", opacity: 0 });

            // 執行新投影片的淡入
            gsap.to(newSlide, {
                opacity: 1,
                duration: 1,
                ease: "power2.out",
                onComplete: () => {
                    isAnimating = false; // 動畫結束，解鎖
                }
            });

            // 背景縮放動畫 (從 1.1 緩慢縮至 1.0)
            if (newBg) {
                gsap.fromTo(newBg, { scale: 1.1 }, { scale: 1, duration: 4, ease: "power1.out" });
            }

            // 文字進場動畫
            if (newContent) {
                gsap.fromTo(newContent,
                    { x: -50, opacity: 0 },
                    { x: 0, opacity: 1, duration: 0.8, delay: 0.3, ease: "back.out(1.7)" }
                );
            }
        }
        window.addEventListener('load', loadWorks);
    </script>

</body>

</html>
