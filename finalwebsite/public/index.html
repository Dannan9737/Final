<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體設計</title>
    <link rel="icon" href="images/Logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <h1><img src="images/MD-logo.png" alt="LOGO" class="logo">多媒體設計</h1>
        <nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">應用領域</a></li>
                <li><a href="courses.html">學習內容</a></li>
                <li><a href="works.html">展示作品</a></li>
                <li><a href="#" id="openLogin">聯絡/登錄</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>什麽是多媒體設計</h2>
            <p>
                多媒體設計是結合藝術與科技，利用文本、圖像、聲音、動畫、影片等多種媒體元素， 透過電腦等數位工具創作互動式、娛樂性強的視覺內容與應用程式，
                涵蓋遊戲、動畫、影視、網頁設計等領域，強調設計的實用性、娛樂性與使用者互動性。
            </p>
            <span>Department of Multimedia Design</span>
        </section>
    </main>

    <section class="info-section py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="section-title">關於多媒體設計</h2>
                <p class="section-subtitle">結合設計、科技與互動的創作領域</p>
            </div>

            <div class="row g-4" id="about-container">

            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 多媒體設計系 | 國立台中科技大學</p>
    </footer>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>聯絡與登錄</h2>
            <form id="loginForm" action="/contact" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label>姓名</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label>電子郵件</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>訊息內容</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>上傳附件 (選填)</label>
                    <input type="file" name="myFile" style="border:none; background:none;">
                </div>
                <button type="submit" class="submit-btn">傳送並登入</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <script>
        // 1. 動畫邏輯
        function initHomeAnimation() {
            if (typeof gsap !== 'undefined') {
                gsap.registerPlugin(ScrollTrigger);

                // 抓取剛生成的卡片
                const cards = document.querySelectorAll(".info-card");

                if (cards.length > 0) {
                    // 先確保把卡片歸零（以防萬一 CSS 沒改掉）
                    gsap.set(cards, { opacity: 0, y: 40 });

                    gsap.to(cards, {
                        opacity: 1,
                        y: 0,
                        duration: 1,
                        stagger: 0.2,
                        ease: "power2.out",
                        scrollTrigger: {
                            trigger: "#about-container",
                            start: "top 85%", // 稍微調低一點觸發點，比較容易看到
                        }
                    });
                }
            }
        }

        // 2. 抓取資料
        async function loadAboutContent() {
            try {
                console.log("開始抓取首頁資料...");
                const response = await fetch('/about');
                const data = await response.json();
                console.log("收到的資料:", data); // 這裡檢查資料有沒有進來

                const container = document.getElementById('about-container');

                if (data && data.length > 0) {
                    container.innerHTML = data.map(item => `
                <div class="col-md-4">
                    <div class="info-card">
                        <div class="icon">${item.icon}</div>
                        <h3>${item.title}</h3>
                        <p>${item.text}</p>
                    </div>
                </div>
            `).join('');

                    console.log("HTML 注入成功，準備啟動動畫");
                    initHomeAnimation();
                } else {
                    console.warn("資料庫是空的！");
                }
            } catch (error) {
                console.error('抓取失敗:', error);
            }
        }

        // 3. 啟動
        window.addEventListener('load', loadAboutContent);
    </script>

</body>

</html>
