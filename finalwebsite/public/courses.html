<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體設計</title>
    <link rel="icon" href="images/Logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <header>
            <h1><img src="images/MD-logo.png" alt="LOGO" class="logo">多媒體設計</h1>
            <nav>
                <div class="menu-toggle" id="mobile-menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <ul class="nav-list">
                    <li><a class="login-btn" @click.prevent="openModal">登入</a></li>
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="about.html">應用領域</a></li>
                    <li><a href="courses.html">學習內容</a></li>
                    <li><a href="works.html">展示作品</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="cour">
                <canvas id="galaxy-canvas" ref="galaxyCanvas"></canvas>
                <div class="cour-content">
                    <h2>多媒體設計的學習内容</h2>
                    <h2>與能力培養</h2>
                </div>
            </section>

            <section class="info-section py-5">
                <div class="container">

                    <div class="courses-row" v-for="(course, index) in courses" :key="index" :class="{ reverse: course.reverse }">
                        <div class="courses-img">
                            <img :src="course.image" :alt="course.title">
                        </div>
                        <div class="courses-text">
                            <h3>{{ course.title }}</h3>
                            <p>{{ course.description }}</p>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 多媒體設計系 | 國立台中科技大學</p>
        </footer>

        <div id="loginModal" class="modal" v-if="showModal">
            <div class="modal-content">
                <span class="close-btn" @click="closeModal">&times;</span>
                <h2>會員資訊登錄</h2>
                <form id="loginForm" @submit.prevent="submitForm">
                    <div class="input-group">
                        <label>姓名</label>
                        <input type="text" id="name" name="name" v-model="form.name" required>
                    </div>
                    <div class="input-group">
                        <label>電子郵件</label>
                        <input type="email" id="email" name="email" v-model="form.email" required>
                    </div>
                    <div class="input-group">
                        <label>訊息內容</label>
                        <textarea id="message" name="message" rows="3" v-model="form.message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">傳送並登入</button>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    showModal: false,
                    form: {
                        name: '',
                        email: '',
                        message: ''
                    },
                    courses: [
                        {
                            title: '設計思考與創意發想',
                            description: '多媒體設計強調從問題出發，思考如何透過設計解決需求。透過創意發想與設計流程，將想法轉化為具體內容，使作品不只是好看，而是能清楚傳達想要表達的訊息。',
                            image: 'images/focus.png',
                            reverse: false
                        },
                        {
                            title: '視覺美感與構圖能力',
                            description: '良好的視覺美感是多媒體設計的重要基礎，包含色彩運用、畫面配置與整體風格掌握。透過構圖與視覺層次的安排，讓畫面看起來更清楚、有重點，也更容易吸引使用者的注意。',
                            image: 'images/composition.png',
                            reverse: true
                        },
                        {
                            title: '數位媒體整合能力',
                            description: '多媒體設計需要整合不同形式的數位內容，例如圖片、動畫、影像與聲音。透過適當的搭配與規劃，使各種媒體元素能互相配合，形成完整且一致的作品呈現。',
                            image: 'images/integrate.png',
                            reverse: false
                        },
                        {
                            title: '團隊合作與專案經驗',
                            description: '在多媒體設計的學習過程中，常需要與不同角色合作完成專案。透過分工與溝通，培養團隊合作能力，並了解從規劃、執行到完成的整體專案流程，為未來實務應用打下基礎。',
                            image: 'images/teamwork.png',
                            reverse: true
                        }
                    ]
                }
            },
            methods: {
                openModal() {
                    this.showModal = true;
                },
                closeModal() {
                    this.showModal = false;
                },
                submitForm() {
                    // 簡單示範：可以在此送到後端或存 localStorage
                    const payload = { ...this.form };
                    console.log('提交:', payload);
                    alert('已傳送，謝謝！');
                    // 重置表單並關閉
                    this.form.name = '';
                    this.form.email = '';
                    this.form.message = '';
                    this.closeModal();
                }
            },
            mounted() {
                // Canvas 動畫初始化（使用 ref）
                const canvas = this.$refs.galaxyCanvas;
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    let w, h;
                    let stars = [];
                    let rotation = 0;
                    const STAR_COUNT = 180;
                    const DPR = Math.min(window.devicePixelRatio || 1, 1.5);

                    function resize() {
                        w = canvas.offsetWidth;
                        h = canvas.offsetHeight;
                        canvas.width = w * DPR;
                        canvas.height = h * DPR;
                        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                    }

                    window.addEventListener('resize', resize);
                    resize();

                    function createStars() {
                        stars = [];
                        for (let i = 0; i < STAR_COUNT; i++) {
                            stars.push({
                                x: Math.random() * w - w / 2,
                                y: Math.random() * h - h / 2,
                                z: Math.random() * w,
                                r: Math.random() * 1.5 + 0.5
                            });
                        }
                    }
                    createStars();

                    let mouseX = 0, mouseY = 0;
                    canvas.addEventListener('mousemove', e => {
                        const rect = canvas.getBoundingClientRect();
                        mouseX = (e.clientX - rect.left - w / 2) * 0.02;
                        mouseY = (e.clientY - rect.top - h / 2) * 0.02;
                    });

                    function animate() {
                        ctx.clearRect(0, 0, w, h);
                        ctx.save();
                        ctx.translate(w / 2, h / 2);
                        rotation += 0.0003;
                        ctx.rotate(rotation);

                        stars.forEach(star => {
                            star.z -= 0.35;
                            if (star.z <= 0) star.z = w;
                            const scale = w / star.z;
                            const x = star.x * scale + mouseX;
                            const y = star.y * scale + mouseY;
                            const alpha = Math.min(1, scale * 0.5);

                            if (scale > 0.9) {
                                ctx.shadowColor = 'rgba(180,200,255,0.6)';
                                ctx.shadowBlur = 6;
                            } else {
                                ctx.shadowBlur = 0;
                            }

                            ctx.beginPath();
                            ctx.fillStyle = `rgba(200,220,255,${alpha})`;
                            ctx.arc(x, y, star.r * scale, 0, Math.PI * 2);
                            ctx.fill();
                        });
                        ctx.restore();
                        requestAnimationFrame(animate);
                    }
                    animate();
                }

                // GSAP + ScrollTrigger 初始化
                if (window.gsap && window.ScrollTrigger) {
                    gsap.registerPlugin(ScrollTrigger);

                    // 延遲一個幀以確保 Vue 已完成渲染 courses-row
                    requestAnimationFrame(() => {
                        gsap.utils.toArray('.courses-row').forEach((row) => {
                            const xStart = row.classList.contains('reverse') ? 100 : -100;

                            gsap.from(row, {
                                opacity: 0,
                                x: xStart,
                                duration: 1,
                                ease: 'power2.out',
                                scrollTrigger: {
                                    trigger: row,
                                    start: 'top 85%',
                                    toggleActions: 'play reverse play reverse',
                                    markers: false,
                                },
                            });
                        });

                        window.addEventListener('resize', () => {
                            ScrollTrigger.refresh();
                        });
                    });
                }
            }
        }).mount('#app');
    </script>

</body>

</html>
