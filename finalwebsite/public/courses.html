<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒體設計</title>
    <link rel="icon" href="images/Logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <header>
        <h1><img src="images/MD-logo.png" alt="LOGO" class="logo">多媒體設計</h1>
        <nav>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <ul class="nav-list">
                <li><a href="index.html">首頁</a></li>
                <li><a href="about.html">應用領域</a></li>
                <li><a href="courses.html">學習內容</a></li>
                <li><a href="works.html">展示作品</a></li>
                <li><a href="#" id="openLogin">聯絡/登錄</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cour">
            <canvas id="galaxy-canvas"></canvas>
            <div class="cour-content">
                <h2>多媒體設計的學習内容</h2>
                <h2>與能力培養</h2>
            </div>
        </section>
    </main>

    <section class="info-section py-5">
        <div class="container" id="course-list">

        </div>
    </section>

    <footer>
        <p>&copy; 2026 多媒體設計系 | 國立台中科技大學</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.0/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
    
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>聯絡與登錄</h2>
            <form id="loginForm" action="/contact" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <label>姓名</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label>電子郵件</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="input-group">
                    <label>訊息內容</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>
                <div class="input-group">
                    <label>上傳附件 (選填)</label>
                    <input type="file" name="myFile" style="border:none; background:none;">
                </div>
                <button type="submit" class="submit-btn">傳送並登入</button>
            </form>
        </div>
    </div>

    <script>
        // 使用 DOMContentLoaded 確保 HTML 元素（如 #galaxy-canvas）已經生成
        document.addEventListener("DOMContentLoaded", () => {

            // --- 星空 Canvas 邏輯 ---
            const canvas = document.getElementById("galaxy-canvas");
            if (canvas) {
                const ctx = canvas.getContext("2d");
                let w, h;
                let stars = [];
                let rotation = 0;
                const STAR_COUNT = 180;
                const DPR = Math.min(window.devicePixelRatio || 1, 1.5);

                function resize() {
                    w = canvas.offsetWidth;
                    h = canvas.offsetHeight;
                    canvas.width = w * DPR;
                    canvas.height = h * DPR;
                    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                }

                window.addEventListener("resize", resize);
                resize();

                function createStars() {
                    stars = [];
                    for (let i = 0; i < STAR_COUNT; i++) {
                        stars.push({
                            x: Math.random() * w - w / 2,
                            y: Math.random() * h - h / 2,
                            z: Math.random() * w,
                            r: Math.random() * 1.5 + 0.5
                        });
                    }
                }
                createStars();

                let mouseX = 0, mouseY = 0;
                canvas.addEventListener("mousemove", e => {
                    const rect = canvas.getBoundingClientRect();
                    mouseX = (e.clientX - rect.left - w / 2) * 0.02;
                    mouseY = (e.clientY - rect.top - h / 2) * 0.02;
                });

                function animate() {
                    ctx.clearRect(0, 0, w, h);
                    ctx.save();
                    ctx.translate(w / 2, h / 2);
                    rotation += 0.0003;
                    ctx.rotate(rotation);

                    stars.forEach(star => {
                        star.z -= 0.35;
                        if (star.z <= 0) star.z = w;
                        const scale = w / star.z;
                        const x = star.x * scale + mouseX;
                        const y = star.y * scale + mouseY;
                        const alpha = Math.min(1, scale * 0.5);

                        if (scale > 0.9) {
                            ctx.shadowColor = "rgba(180,200,255,0.6)";
                            ctx.shadowBlur = 6;
                        } else {
                            ctx.shadowBlur = 0;
                        }

                        ctx.beginPath();
                        ctx.fillStyle = `rgba(200,220,255,${alpha})`;
                        ctx.arc(x, y, star.r * scale, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                    requestAnimationFrame(animate);
                }
                animate();
            }
             window.addEventListener("resize", () => {
                ScrollTrigger.refresh();
            });
        });

            function initGsap() {
                if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
                    console.error("GSAP 或 ScrollTrigger 未載入");
                    return;
                }

                gsap.registerPlugin(ScrollTrigger);

                // 先清除舊的 ScrollTrigger 避免重複綁定
                ScrollTrigger.getAll().forEach(t => t.kill())

                gsap.utils.toArray(".courses-row").forEach((row, i) => {
                    const xStart = row.classList.contains("reverse") ? 100 : -100;

                    gsap.from(row, {
                        opacity: 0,
                        x: xStart,
                        duration: 1,
                        ease: "power2.out",
                        scrollTrigger: {
                            trigger: row,
                            start: "top 85%",
                            toggleActions: "play reverse play reverse",
                            markers: false,
                        },
                    });
                });
                // 強制重新計算位置
                ScrollTrigger.refresh();
            }

        // 抓取資料並在成功後啟動動畫
        async function loadCourseData() {
            try {
                // 向我們在 server.js 寫好的 API 請求資料
                const response = await fetch('/courses');
                const data = await response.json();
                const container = document.getElementById('course-list');

                // 將資料庫的每一筆資料轉換成 HTML 標籤
                container.innerHTML = data.map(course => `
                <div class="courses-row ${course.reverse ? 'reverse' : ''}">
                    <div class="courses-img">
                        <img src="${course.imgSrc}" alt="${course.title}">
                    </div>
                    <div class="courses-text">
                        <h3>${course.title}</h3>
                        <p>${course.text}</p>
                    </div>
                </div>
            `).join('');

                initGsap();

            } catch (error) {
                console.error('抓取資料失敗:', error);
            }
        }

        window.onload = () => {
            loadCourseData();
            // 呼叫星空 Canvas 
        };
    </script>

</body>

</html>
